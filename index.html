<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>楓之谷命中率計算器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script>
    $(document).ready(function(){
        jQuery.expr[':'].contains = function(a, i, m) {
            return jQuery(a).text().toUpperCase().indexOf(m[3].toUpperCase()) >= 0;
        };
        $(document).on('focus', '#search', function() {
            var inp = $(this).val();
            if (inp == '搜尋...') $(this).val('');
        });
        $(document).on('focusout', '#search', function() {
            var inp = $(this).val();
            if (inp == '') $(this).val('搜尋...');
        });
        $(document).on('keyup', '#search', function(){
            var inp = $(this).val().toLowerCase();
            if (inp !== '' && inp !== '搜尋...') {
                $('#mobs').find('option').each(function() {
                    var text = $(this).text().toLowerCase();
                    $(this).toggle(text.includes(inp));
                });
            } else {
                $('#mobs').find('option').show();
            }
        });
        worldSelect('all_zh_filtered_no_english_korean');
        clearForm();
        // 自動觸發命中計算
        $(document).on('input change', '#level, #mainstat, #luk, #mobLevel, #mobAvoid', function() {
            doSomeMath();
        });
        $(document).on('change', 'input[name="type"]', function() {
            dmgType(this.id === 'magical' ? '智力:' : '命中:');
            doSomeMath();
        });
        // 自動觸發命中計算
        $(document).on('input change', '#level, #mainstat, #luk, #mobLevel, #mobAvoid', function() {
            doSomeMath();
        });
        $(document).on('change', 'input[name="type"]', function() {
            dmgType(this.id === 'magical' ? '智力:' : '命中:');
            doSomeMath();
        });
        $(document).on('input change', '#level, #mainstat, #luk, #mobLevel, #mobAvoid', function() {
            doSomeMath();
        });
        $(document).on('change', 'input[name="type"]', function() {
            dmgType(this.id === 'magical' ? '智力:' : '命中:');
            doSomeMath();
        });
    });
$(document).on('input change', '#level, #mainstat, #luk, #mobLevel, #mobAvoid', function() {
    doSomeMath();
});
$(document).on('change', 'input[name="type"]', function() {
    dmgType(this.id === 'magical' ? '智力:' : '命中:');
    doSomeMath();
});
</script>
<style>
        body {
            background-color: #000;
            color: #fff;
        }
        input, select, button, label {
            background-color: #111;
            color: #fff;
            border: 1px solid #444;
        }
        table, th, td {
            border: 2px solid #888;
            margin-left: auto;
            margin-right: auto;
            text-align: center;
        }
        th, td, img {
            max-height: 200px;
            max-width: 200px;
        }
        input, select {
            width: 95%;
            box-sizing: border-box;
        }
        input {
            text-align: right;
        }
        img { 
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
    <script>
        $(document).ready(function(){
            jQuery.expr[':'].contains = function(a, i, m) {
                return jQuery(a).text().toUpperCase().indexOf(m[3].toUpperCase()) >= 0;
            };
            $(document).on('focus', '#search', function() {
                var inp = $(this).val();
                if (inp == '搜尋...')
                    $(this).val('');
            });
            $(document).on('focusout', '#search', function() {
                var inp = $(this).val();
                if (inp == '') {
                    $(this).val('搜尋...');    
                }
            });
            $(document).on('keyup', '#search', function(){
    var inp = $(this).val().toLowerCase();
    if (inp !== '' && inp !== '搜尋...') {
        $('#mobs').find('option').each(function() {
            var text = $(this).text().toLowerCase();
            $(this).toggle(text.includes(inp));
        });
    } else {
        $('#mobs').find('option').show();
    }
});
            worldSelect('all_zh_filtered_no_english_korean');
            clearForm();
        });

        function clearForm(){
            document.calc.reset();
            document.getElementById("luk").disabled = true;
            document.getElementById("lukBlock").style.display = 'none';
            document.getElementById("dmgType").innerHTML = '命中:';
            document.getElementById("liblink").href = '';
            document.getElementById("mobPic").src = '';
            document.getElementById('HP').innerHTML = '-';
            document.getElementById('EXP').innerHTML = '-';
            document.getElementById('weak').innerHTML = '-';
            document.getElementById('strong').innerHTML = '-';
            document.getElementById('immune').innerHTML = '-';
            $('#mobs').empty().append('<option value="null">請選擇怪物</option>');
        }

        var loadedjson;
        function elementChecker(array){
            let arr = [];
            if(array[0]) arr.push('冰');
            if(array[1]) arr.push('雷');
            if(array[2]) arr.push('火');
            if(array[3]) arr.push('毒');
            if(array[4]) arr.push('聖');
            if(arr.length == 0) arr.push('-');
            return arr;
        }

        function dmgType(type) {
            const lukInput = document.getElementById("luk");
            const lukBlock = document.getElementById("lukBlock");
            if (type == '智力:' && lukInput && lukBlock) {
                lukInput.disabled = false;
                lukBlock.style.display = 'block';
            } else if (lukInput && lukBlock) {
                lukInput.disabled = true;
                lukBlock.style.display = 'none';
            }
            document.getElementById("dmgType").innerHTML = type == '智力:' ? '智力:' : '命中:';
        }

        function worldSelect(world){
    $.getJSON('Monsters/' + world + '.json', function(data){
        loadedjson = data;
        const entries = Object.entries(data).sort((a, b) => a[1].level - b[1].level);
        $('#mobs').empty();
        entries.forEach(([key, value]) => {
            $('#mobs').append('<option value="' + key + '">' + "(" + value["level"] + ") " + key + '</option>');
        });
    });
}

        function mobSelect(mob){
            if(mob != "null"){
                document.getElementById('mobPic').src = 'images/' + loadedjson[mob]["id"] + '.png';
                document.getElementById('mobLevel').value = loadedjson[mob]["level"];
                document.getElementById('mobAvoid').value = loadedjson[mob]["avoid"];
                document.getElementById('HP').innerHTML = loadedjson[mob]["hp"];
                document.getElementById('EXP').innerHTML = loadedjson[mob]["exp"];
                document.getElementById('liblink').href = 'https://maplelegends.com/lib/monster?id=' + loadedjson[mob]["id"];
                document.getElementById('weak').innerHTML = elementChecker(loadedjson[mob]['weak']).toString();
                document.getElementById('strong').innerHTML = elementChecker(loadedjson[mob]['strong']).toString();
                document.getElementById('immune').innerHTML = elementChecker(loadedjson[mob]['immune']).toString();
            }
        }

        function sortByLevel(){
            var options = $('#mobs option');
            options.sort(function(a,b) {
                return loadedjson[a.value]["level"] - loadedjson[b.value]["level"];
            });
            $('#mobs').empty().append(options);
        }

        function sortByAlpha(){
            var options = $('#mobs option');
            options.sort(function(a,b) {
                return a.value.localeCompare(b.value);
            });
            $('#mobs').empty().append(options);
        }

        function doSomeMath(){
            var monLevel = parseInt(document.getElementById('mobLevel').value);
            var monAvoid = parseInt(document.getElementById('mobAvoid').value);
            var charLevel = parseInt(document.getElementById('level').value);
            var charMainStat = parseInt(document.getElementById('mainstat').value);
            var lukElement = document.getElementById('luk');
            var charLuk = lukElement ? parseInt(lukElement.value) : 0;
            var diff = monLevel - charLevel;
            var acc100 = 0;
            var acc1 = 0;
            var AccRatio = 0;
            if(diff < 0) diff = 0;

            if(document.querySelector('input[name="type"]:checked').id == 'physical') {
                acc100 = (55.2 + 2.15 * diff) * (monAvoid / 15.0);
                acc1 = acc100 * 0.5 + 1;
                AccRatio = 100 * ((charMainStat - (acc100 * 0.5)) / (acc100 * 0.5));
            } else {
                var curAcc = Math.floor(charMainStat / 10) + Math.floor(charLuk / 10);
                acc100 = Math.floor((monAvoid + 1.0) * (1.0 + (0.04 * diff)));
                acc1 = Math.round(0.41 * acc100);
                var AccPart = (curAcc - acc1 + 1) / (acc100 - acc1 + 1);
                AccRatio = ((-0.7011618132 * Math.pow(AccPart, 2)) + (1.702139835 * AccPart)) * 100;
            }

            if(AccRatio > 100) AccRatio = 100;
            else if(AccRatio < 0) AccRatio = 0;

            document.getElementById('mob1acc').value = acc1.toPrecision(3);
            document.getElementById('mob100acc').value = acc100.toPrecision(3);
            document.getElementById('mobRate').value = AccRatio.toPrecision(3) + "%";
        }
    </script>
</head>
<body>
    <form name="calc">
        <table>
            <tr>
                <th>怪物清單</th>
                <th>角色屬性</th>
            </tr>
            <tr>
                <td>
                    <input autocomplete="off" id="search" size="9" value="搜尋..." style="text-align: left;">
                    <br>
                    <select class="mobs" size="7" name="mobs" id="mobs" onchange="mobSelect(this.value); doSomeMath();">
                        <option value="null">請選擇怪物</option>
                    </select>
                </td>
                <td rowspan="2">
                    <label for="level">等級:</label>
                    <input type="number" id="level" min="1" max="200" value="1">
                    <br>
                    <input type="radio" id="physical" name="type" onclick="dmgType('命中:')" checked style="width:auto">
                    <label for="physical">物理攻擊</label>
                    <br>
                    <input type="radio" id="magical" name="type" onclick="dmgType('智力:')" style="width:auto">
                    <label for="magical">魔法攻擊</label>
                    <br>
                    <label for="mainstat" id="dmgType">命中:</label>
                    <input type="number" id="mainstat" min="4" max="999" value="4">
                    <br>
                    <div id="lukBlock" style="display: none; margin-top: 5px;">
    <label for="luk">幸運:</label>
    <input type="number" id="luk" disabled="true" min="4" max="999" value="4">
</div>
                </td>
            </tr>
            <tr>
    <td>
        <label for="mobLevel">怪物等級:</label>
        <input type="number" id="mobLevel" disabled min="1" max="200" value="1">
        <br>
        <label for="mobAvoid">怪物閃避:</label>
        <input type="number" id="mobAvoid" disabled min="0" max="999" value="0">
    </td>
</tr>

<tr>
  <td>
    <a id="liblink" target="_blank">
      <img id="mobPic" src="" />
    </a>
  </td>
  <td rowspan="2">
    <label for="mob1acc">1% 命中需求:</label>
    <input type="text" id="mob1acc" size="10" disabled="true">
    <br>
    <label for="mob100acc">100% 命中需求:</label>
    <input type="text" id="mob100acc" size="8" disabled="true">
    <br>
    <label for="mobRate">實際命中率:</label>
    <input type="text" id="mobRate" size="17" disabled="true">
  </td>
</tr>
<tr>
  <td>
    <label>弱點屬性:</label>
    <label id="weak">-</label>
    <br>
    <label>強抗屬性:</label>
    <label id="strong">-</label>
    <br>
    <label>免疫屬性:</label>
    <label id="immune">-</label>
    <br>
    <label>HP:</label>
    <label id="HP">-</label>
    <br>
    <label>EXP:</label>
    <label id="EXP">-</label>
  </td>
</tr>
    </table>
  </td>
</tr>
</table>
</form>
<p style="text-align: center; font-size: smaller;">感謝 Screaming Statue、Nekonecat、ayumilove、安心、Nani 與 Treehouse 提供協助與資料。</p>
</body>
</html>
